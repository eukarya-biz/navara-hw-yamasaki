# Builds the app and publishes it to GitHub Pages.
#
# This exists so the build output never has to be committed: pushing to the
# default branch produces the deployment. Pages has to be switched on once,
# with "Source: GitHub Actions" (Settings > Pages) -- in eukarya-biz that is an
# IT request, since repository creators cannot enable Pages themselves.
#
# vite.config.ts sets `base: "./"`, so this works regardless of the repository
# name and needs no configuration here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy, but never interrupt one midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The walk grid and the goal coordinates are hard-coded measurements taken
      # from the tileset, so verify they still agree with the shipped data before
      # publishing anything.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
